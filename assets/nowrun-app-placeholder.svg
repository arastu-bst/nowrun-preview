<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Android app">
<style>
.tile{fill:#171717}
.dome{fill:#fafafa;stroke:#fafafa;stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw .9s ease-out forwards,fillin .45s ease-out .75s forwards}
.ant{stroke:#fafafa;stroke-width:4;stroke-linecap:round;fill:none;transform-box:fill-box;transform:scale(0);animation:ant .4s cubic-bezier(.3,1.5,.5,1) 1.15s forwards}
.a1{transform-origin:bottom right}.a2{transform-origin:bottom left}
.eye{fill:#171717;opacity:0;transform-box:fill-box;transform-origin:center;animation:eyein .2s ease-out 1.55s forwards,blink 3.4s ease-in-out 2.3s infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fillin{to{fill-opacity:1}}@keyframes ant{to{transform:scale(1)}}
@keyframes eyein{to{opacity:1}}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.dome{animation:none;stroke-dashoffset:0;fill-opacity:1}.ant{animation:none;transform:scale(1)}.eye{animation:none;opacity:1}}
</style>
<rect class="tile" width="100" height="100" rx="26"/>
<g transform="translate(18 18) scale(.64)">
<path class="dome" d="M14 66 A36 36 0 0 1 86 66 Z" pathLength="1"/>
<path class="ant a1" d="M30 37 L21 23"/><path class="ant a2" d="M70 37 L79 23"/>
<circle class="eye" cx="37" cy="51" r="4"/><circle class="eye" cx="63" cy="51" r="4"/>
</g></svg>